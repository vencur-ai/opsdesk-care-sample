[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdesk-care-runtime"
version = "2.4.13"
description = "OpsDesk-Care episode runtime and deterministic verifier"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic", "mcp", "setuptools"]

[tool.setuptools.packages.find]
where = ["."]
include = ["opsdesk*"]
